<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Authenticator Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{min-height:100vh;background:#f4f8f6;display:flex;align-items:center;justify-content:center}
        .auth-card{width:100%;max-width:430px;background:white;border:1px solid #dce8e3;border-radius:18px;padding:35px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
        .logo-box{width:55px;height:55px;border-radius:14px;background:#e7f0ec;color:#527568;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-bottom:20px}
        .btn-auth{background:#6f9485;border:none;color:white;padding:11px;border-radius:9px}
    </style>
</head>
<body>
<div class="auth-card">
    <div class="logo-box">B</div>
    <h3 class="mb-2">Google Authenticator</h3>
    <p class="text-muted mb-4">
        Enter the current 6-digit code from Google Authenticator.
    </p>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <form method="post" action="/2fa/verify">
        <input type="hidden"
               name="token"
               th:value="${pendingToken}">

        <div class="mb-3">
            <label for="code" class="form-label">
                Authentication Code
            </label>

            <input type="text"
                   id="code"
                   name="code"
                   class="form-control"
                   placeholder="000000"
                   maxlength="6"
                   minlength="6"
                   pattern="[0-9]{6}"
                   inputmode="numeric"
                   autocomplete="one-time-code"
                   required>
        </div>

        <button type="submit" class="btn btn-auth w-100">
            Verify & Continue
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="/lost-2fa" class="text-decoration-none">
            Lost your Google Authenticator?
        </a>
    </div>
</div>
</body>
</html>
